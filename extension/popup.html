<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LeetCode AI Helper</title>
    <link rel="stylesheet" href="popup.css">
</head>
<body>
    <div class="container">
        <header>
            <div class="brand">
                <span class="logo">⚡</span>
                <h1>AI Helper</h1>
            </div>
            <button id="btn-settings" class="icon-btn" title="Settings">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
            </button>
        </header>
        
        <div id="main-view">
            <div class="buttons-grid">
                <button id="btn-explain" class="action-btn">
                    <span class="icon">📖</span>
                    <span>Explain</span>
                </button>
                <button id="btn-syntax" class="action-btn">
                    <span class="icon">🔍</span>
                    <span>Syntax</span>
                </button>
                <button id="btn-logic" class="action-btn">
                    <span class="icon">🧠</span>
                    <span>Logic</span>
                </button>
                <button id="btn-hint" class="action-btn">
                    <span class="icon">💡</span>
                    <span>Hint</span>
                </button>
                <button id="btn-pattern" class="action-btn wide">
                    <span class="icon">🧩</span>
                    <span>Identify Pattern</span>
                </button>
            </div>
            
            <div id="loading" class="hidden">
                <div class="loader"></div>
                <p>Analyzing problem...</p>
            </div>
        </div>

        <div id="settings-view" class="hidden">
            <div class="settings-header">
                <button id="btn-back" class="icon-btn">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
                </button>
                <h2>Settings</h2>
            </div>
            <div class="setting-item">
                <label for="api-key">OpenRouter API Key</label>
                <input type="password" id="api-key" placeholder="sk-or-v1-...">
                <p class="help-text">Get one at <a href="https://openrouter.ai/" target="_blank">openrouter.ai</a></p>
            </div>
            <button id="btn-save-key" class="save-btn">Save Settings</button>
        </div>

        <div id="output" class="hidden">
            <!-- Legacy output hidden but kept for logic compatibility -->
            <p id="question-text"></p>
            <div id="answer-content"></div>
        </div>
    </div>
    <script src="popup.js"></script>
</body>
</html>
